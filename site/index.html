<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Gym Explainers</title>
    <style>
      :root {
        --bg: #faf8f5;
        --card: #ffffff;
        --ink: #23201c;
        --muted: #6b6560;
        --line: #e4dfd8;
        --accent: #c2502e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171513;
          --card: #211e1b;
          --ink: #efeae4;
          --muted: #a59d95;
          --line: #3a3530;
          --accent: #f08a62;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: block;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        border-color: var(--accent);
      }
      strong {
        display: block;
        font-size: 18px;
      }
      span {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Paper Gym Explainers</h1>
      <p>논문의 텐서와 연산을 단계마다 따라가 보는 설명 페이지 모음입니다. 화면의 값은 설명을 위한 가상 값입니다.</p>
      <ul>
        <li>
          <a href="turbovla/">
            <strong>TurboVLA Explainer</strong>
            <span>TurboVLA (arXiv 2607.27205): LLM 없이 vision과 language를 바로 섞어 action chunk를 내는 VLA</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
