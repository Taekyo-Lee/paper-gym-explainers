<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TurboVLA (arXiv 2607.27205)의 텐서 모양과 연산 순서를 따라가 보는 설명용 페이지. 모든 값은 가상 값입니다." />
    <meta name="color-scheme" content="light dark" />
    <title>TurboVLA Explainer</title>
    <script>
      // 첫 그림 전에 테마를 정해 깜빡임을 막는다. key는 state/store.svelte.ts와 같다.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('paper-gym.turbovla.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
